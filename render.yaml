services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: edupulse-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:///./classroom_analytics.db"

  # 2. Vite React Frontend Static Site
  - type: web
    name: edupulse-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: edupulse-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
